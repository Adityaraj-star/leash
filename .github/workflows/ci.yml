name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4 # the signing script's unit tests run under Node
        with:
          node-version: "22"
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      - name: Tests (race detector on Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Tests
        if: runner.os != 'Linux'
        run: go test ./...
      - name: Short fuzz runs
        if: runner.os == 'Linux'
        run: |
          go test ./internal/ledger -run '^$' -fuzz FuzzTamper -fuzztime 15s
          go test ./internal/policy -run '^$' -fuzz FuzzEvaluateSafety -fuzztime 15s
          go test ./internal/money -run '^$' -fuzz FuzzParseRoundTrip -fuzztime 10s

  dashboard:
    # Drives the real dashboard (in jsdom) against a real server: create the
    # signing key, sign a mandate, approve with a signature, see an attack blocked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: web/e2e
      - run: node dashboard.e2e.mjs
        working-directory: web/e2e
      - name: Test scripts still parse
        run: |
          node --check scripts/agent-sim.mjs
          node --check scripts/demo-merchant.mjs

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
